name: CI/CD Pipeline Banco

on:
  push:
    branches:
      - main
      - mi-rama

jobs:
  tests_and_sonar:
    name: Pruebas y SonarCloud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lab1v2026/lab1v2026
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'lab1v2026/lab1v2026/pom.xml'
      - name: Ejecutar Pruebas y JaCoCo
        run: mvn -B test
      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  build_and_docker:
    name: Construir y Subir a Docker Hub
    needs: tests_and_sonar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build & push Docker image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: juanramirez50/banco-lab1
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          directory: lab1v2026/lab1v2026
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}